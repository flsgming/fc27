workflows:
  build-fc27-ios:
    name: EA SPORTS FC 27 iOS (IPA + romfs.img — A17 Pro+ & Miao Pink UI)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - fc27_secrets
      vars:
        # Language code: "en" for default English, or e.g. "it", "fr", "es"
        GAME_LANG: "en"
      xcode: 27.0
    scripts:
      - name: 1. Free Disk Space (Target > 190 GB)
        script: |
          set -euo pipefail
          df -h /
          rm -rf "${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}" "$HOME/Library/Android" || true
          xcrun simctl runtime delete all || true
          rm -rf "$HOME/Library/Caches/"* "$HOME/Library/Developer/Xcode/DerivedData/"* || true
          brew cleanup --prune=all || true
          df -h /

      - name: 2. Install & Verify All Build Tools (Fail-Fast)
        script: |
          set -euo pipefail
          # 2A. Metal Toolchain (with Xcode 26/27 DMG manual-mount fallback)
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Downloading Xcode MetalToolchain..."
            xcodebuild -downloadComponent MetalToolchain || true
            sleep 3
          fi
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "MetalToolchain not auto-mounted; manually installing Metal.xctoolchain from DMG..."
            DMG=$(find /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain -name "*.dmg" 2>/dev/null | head -n 1 || true)
            if [ -n "$DMG" ]; then
              mkdir -p /tmp/metal_mnt
              hdiutil attach -nobrowse -readonly "$DMG" -mountpoint /tmp/metal_mnt
              TC=$(find /tmp/metal_mnt -maxdepth 3 -name "Metal.xctoolchain" -type d | head -n 1 || true)
              if [ -n "$TC" ]; then
                sudo mkdir -p /Library/Developer/Toolchains
                sudo rm -rf /Library/Developer/Toolchains/Metal.xctoolchain
                sudo cp -R "$TC" /Library/Developer/Toolchains/Metal.xctoolchain
              fi
              hdiutil detach /tmp/metal_mnt || true
            fi
            sudo xcodebuild -runFirstLaunch || true
          fi
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version

          # 2B. CLI tools required by seedds/nxnative
          brew install xcodegen zstd spirv-cross glslang || true
          for tool in xcodegen zstd spirv-cross glslangValidator; do
            command -v "$tool" >/dev/null 2>&1 || { echo "ERROR: Missing required tool: $tool"; exit 1; }
          done

          # 2C. Dual-arch .NET 10 (arm64 + x64)
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 10.0 --architecture arm64 --install-dir "$HOME/.dotnet"
          /tmp/dotnet-install.sh --channel 10.0 --runtime dotnet --architecture x64 --install-dir "$HOME/.dotnet-x64"

          # 2D. Python virtual environment
          python3 -m venv "$CM_BUILD_DIR/.venv"
          source "$CM_BUILD_DIR/.venv/bin/activate"
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir \
            uv lz4 "capstone>=5,<6" fonttools nsz zbic pycryptodome zstandard pillow \
            requests gdown "backports.zstd; python_version < '3.14'"

      - name: 3. Clone Upstream seedds/nxnative & Download Game Files
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          git clone --depth 1 https://github.com/seedds/nxnative.git "$CM_BUILD_DIR/nxnative"
          git clone --depth 1 https://github.com/ltsdw/gofile-downloader.git "$CM_BUILD_DIR/gf_dl"
          find "$CM_BUILD_DIR/nxnative" \( -name "*.sh" -o -name "dmsh_xlate" -o -name "spirv-cross" -o -name "nx_extract" \) -exec chmod +x {} + || true

          # Fail-fast check before downloading 36 GB
          if [ ! -f "$CM_BUILD_DIR/nxnative/dm/gfx/tools/frostbite.py" ] || [ ! -d "$CM_BUILD_DIR/nxnative/dm/games/0100C49025D3E000" ]; then
            echo "ERROR: seedds/nxnative missing frostbite.py or 0100C49025D3E000 profile!"
            exit 1
          fi

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_DIR="$CM_BUILD_DIR/keys"
          mkdir -p "$GAME_DIR" "$KEYS_DIR"

          download_url() {
            local url="$1"
            local out_dir="$2"
            mkdir -p "$out_dir"
            if [[ "$url" == *"gofile.io/d/"* ]]; then
              echo "Downloading from Gofile via gofile-downloader.py..."
              (cd "$CM_BUILD_DIR/gf_dl" && GF_DOWNLOAD_DIR="$out_dir" uv run gofile-downloader.py "$url")
            elif [[ "$url" == *"drive.google.com"* ]]; then
              echo "Downloading from Google Drive via gdown..."
              gdown "$url" -O "$out_dir/"
            else
              echo "Downloading direct URL..."
              local fname
              fname=$(basename "${url%%\?*}")
              [ -n "$fname" ] || fname="downloaded_file"
              curl -fL --retry 3 "$url" -o "$out_dir/$fname"
            fi
          }

          if [ -z "${BASE_URL:-}" ] || [ -z "${UPDATE_URL:-}" ] || [ -z "${KEYS_URL:-}" ]; then
            echo "ERROR: BASE_URL, UPDATE_URL, and KEYS_URL must be set in group fc27_secrets."
            exit 1
          fi

          echo "Downloading Base NSP..."
          download_url "$BASE_URL" "$GAME_DIR"
          echo "Downloading Update NSP..."
          download_url "$UPDATE_URL" "$GAME_DIR"
          echo "Downloading prod.keys..."
          download_url "$KEYS_URL" "$KEYS_DIR"

          if [ -n "${DLC_URL:-}" ]; then
            echo "Downloading optional DLC..."
            download_url "$DLC_URL" "$GAME_DIR"
          fi

          find "$GAME_DIR" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.nsz" -o -iname "*.xci" \) -exec mv -f {} "$GAME_DIR/" \;

          KEY_FILE=$(find "$KEYS_DIR" -type f ! -name ".*" | head -n 1)
          if [ -z "$KEY_FILE" ]; then
            echo "ERROR: prod.keys not found after download!"
            exit 1
          fi
          if [ "$KEY_FILE" != "$KEYS_DIR/prod.keys" ]; then
            cp -f "$KEY_FILE" "$KEYS_DIR/prod.keys"
          fi

          ls -lh "$GAME_DIR"
          df -h /

      - name: 4. Apply Pink Miao UI Credit & Build FC 27 IPA + romfs.img (A17 Pro+)
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          export DOTNET_ROOT_X64="$HOME/.dotnet-x64"
          export DOTNET_ROLL_FORWARD=Major
          export PATH="$HOME/.dotnet:$PATH"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_FILE="$CM_BUILD_DIR/keys/prod.keys"
          OUT_DIR="$CM_BUILD_DIR/final_out"
          LOG_DIR="$GAME_DIR/0100C49025D3E000_build/logs"
          mkdir -p "$OUT_DIR"
          cd "$CM_BUILD_DIR/nxnative"

          trap 'echo "=== ERROR LOGS ==="; for lf in "$LOG_DIR"/*.log; do [ -f "$lf" ] && echo "--- $lf ---" && tail -n 120 "$lf"; done' ERR

          # 4A. Patch Launcher.swift: pastel pink background + big centered clickable Discord credit card
          python3 - << 'PYEOF'
          import os, re, subprocess, shutil

          candidates = [
              "dm/ios/Sources/Launcher.swift",
              "src/dm/ios/Sources/Launcher.swift",
          ]
          target = next((p for p in candidates if os.path.isfile(p)), None)
          if not target:
              raise RuntimeError("Launcher.swift not found — cannot inject credit UI!")

          orig = open(target, "r", encoding="utf-8").read()

          credit_defs = """
          private struct MiaoCatIcon: Shape {
              func path(in rect: CGRect) -> Path {
                  var p = Path()
                  let w = rect.width, h = rect.height
                  p.move(to: CGPoint(x: w * 0.16, y: h * 0.42))
                  p.addLine(to: CGPoint(x: w * 0.22, y: h * 0.12))
                  p.addLine(to: CGPoint(x: w * 0.40, y: h * 0.30))
                  p.addQuadCurve(to: CGPoint(x: w * 0.60, y: h * 0.30), control: CGPoint(x: w * 0.50, y: h * 0.26))
                  p.addLine(to: CGPoint(x: w * 0.78, y: h * 0.12))
                  p.addLine(to: CGPoint(x: w * 0.84, y: h * 0.42))
                  p.addQuadCurve(to: CGPoint(x: w * 0.50, y: h * 0.88), control: CGPoint(x: w * 0.88, y: h * 0.82))
                  p.addQuadCurve(to: CGPoint(x: w * 0.16, y: h * 0.42), control: CGPoint(x: w * 0.12, y: h * 0.82))
                  p.closeSubpath()
                  return p
              }
          }

          private struct MiaoCreditBanner: View {
              private let discordURL = URL(string: "https://discord.com/users/893716299014873088")!
              var body: some View {
                  Link(destination: discordURL) {
                      VStack(spacing: 6) {
                          HStack(spacing: 8) {
                              MiaoCatIcon()
                                  .fill(Color(red: 0.93, green: 0.28, blue: 0.58))
                                  .frame(width: 24, height: 24)
                              Text("Port By Miaomiaocute nè")
                                  .font(.title3.weight(.bold))
                                  .foregroundColor(Color(red: 0.72, green: 0.12, blue: 0.42))
                                  .multilineTextAlignment(.center)
                          }
                          Text("Nhấn để mở Discord")
                              .font(.caption.weight(.semibold))
                              .foregroundColor(Color(red: 0.85, green: 0.25, blue: 0.52))
                      }
                      .frame(maxWidth: .infinity, alignment: .center)
                      .padding(.vertical, 14)
                      .padding(.horizontal, 16)
                      .background(
                          RoundedRectangle(cornerRadius: 16, style: .continuous)
                              .fill(Color(red: 1.0, green: 0.84, blue: 0.91))
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: 16, style: .continuous)
                              .stroke(Color(red: 0.96, green: 0.55, blue: 0.74), lineWidth: 1.5)
                      )
                  }
                  .buttonStyle(.plain)
                  .frame(maxWidth: .infinity, alignment: .center)
              }
          }

          private struct MiaoPinkBackgroundModifier: ViewModifier {
              func body(content: Content) -> some View {
                  if #available(iOS 16.0, *) {
                      content
                          .scrollContentBackground(.hidden)
                          .background(Color(red: 1.0, green: 0.93, blue: 0.96).ignoresSafeArea())
                  } else {
                      content
                          .background(Color(red: 1.0, green: 0.93, blue: 0.96).ignoresSafeArea())
                  }
              }
          }
          """

          def find_matching_brace(text, open_brace_idx):
              depth = 0
              i = open_brace_idx
              in_str = False
              while i < len(text):
                  ch = text[i]
                  if ch == '"' and (i == 0 or text[i - 1] != '\\'):
                      in_str = not in_str
                  elif not in_str:
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          patched = None
          for kind, pat in [("form", r'Form\s*\{'), ("list", r'List\s*\{'), ("vstack", r'VStack(?:\([^)]*\))?\s*\{')]:
              m = re.search(pat, orig)
              if not m:
                  continue
              open_idx = m.end() - 1
              close_idx = find_matching_brace(orig, open_idx)
              if close_idx == -1:
                  continue
              if kind in ("form", "list"):
                  banner_block = (
                      "\n            Section {\n"
                      "                MiaoCreditBanner()\n"
                      "            }\n"
                      "            .listRowBackground(Color.clear)\n"
                      "            .listRowInsets(EdgeInsets(top: 8, leading: 12, bottom: 8, trailing: 12))\n"
                  )
              else:
                  banner_block = "\n            MiaoCreditBanner()\n                .padding(.horizontal, 12)\n                .padding(.top, 8)\n"
              patched = (
                  orig[:m.end()]
                  + banner_block
                  + orig[m.end():close_idx + 1]
                  + "\n        .modifier(MiaoPinkBackgroundModifier())"
                  + orig[close_idx + 1:]
                  + "\n"
                  + credit_defs
              )
              print(f"Injected pastel pink background + centered Discord credit card into {kind} in {target}")
              break

          if not patched:
              raise RuntimeError("Could not locate Form/List/VStack in Launcher.swift!")

          backup = target + ".bak"
          shutil.copy2(target, backup)
          open(target, "w", encoding="utf-8").write(patched)

          res = subprocess.run(["xcrun", "swiftc", "-parse", target], capture_output=True, text=True)
          if res.returncode != 0:
              print("ERROR: swiftc -parse failed on patched Launcher.swift:\n", res.stderr)
              shutil.move(backup, target)
              raise SystemExit(1)
          os.remove(backup)
          print("Verified Launcher.swift syntax with swiftc -parse: OK!")
          PYEOF

          # 4B. Full RAM entitlements for iPhone 15 Pro+ (A17 Pro+, 8 GB+ RAM)
          cat << 'EOF' > "$CM_BUILD_DIR/ios_entitlements.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key>
            <true/>
          </dict>
          </plist>
          EOF

          LANG_ARGS=()
          if [ "${GAME_LANG:-en}" != "en" ]; then
            LANG_ARGS=(-l "$GAME_LANG")
          fi

          # Hardware BC (A17 Pro+), native 60 FPS + MetalFX from profile
          DM_ENTITLEMENTS="$CM_BUILD_DIR/ios_entitlements.plist" \
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" --platform ios --romfs separate --allow-other-metal -k "$KEYS_FILE" ${LANG_ARGS[@]+"${LANG_ARGS[@]}"}

          # 4C. Move BOTH RomFS.img and EaSportsFc27.ipa out BEFORE cleaning build folder!
          ROMFS_PATH=$(find "$GAME_DIR/0100C49025D3E000_build/extract" -maxdepth 2 -name "RomFS.img" ! -path "*.partial/*" | head -n 1 || true)
          if [ -z "$ROMFS_PATH" ] || [ ! -f "$ROMFS_PATH" ]; then
            echo "ERROR: RomFS.img not found after build!"
            exit 1
          fi
          mv -f "$ROMFS_PATH" "$OUT_DIR/romfs.img"

          IPA_PATH=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: EaSportsFc27.ipa not found after build!"
            exit 1
          fi
          mv -f "$IPA_PATH" "$OUT_DIR/EaSportsFc27.ipa"

          # Now safe to clean GAME_DIR (frees ~72 GB before re-zipping IPA)
          rm -rf "$GAME_DIR"

          # 4D. Inject credit into Info.plist inside EaSportsFc27.ipa
          WORK_IPA="$CM_BUILD_DIR/ipa_credit"
          mkdir -p "$WORK_IPA"
          unzip -qo "$OUT_DIR/EaSportsFc27.ipa" -d "$WORK_IPA"
          PLIST=$(find "$WORK_IPA/Payload" -maxdepth 2 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright 'Port By Miaomiaocute nè'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string 'Port By Miaomiaocute nè'" "$PLIST"
          fi
          rm -f "$OUT_DIR/EaSportsFc27.ipa"
          (cd "$WORK_IPA" && zip -qry "$OUT_DIR/EaSportsFc27.ipa" Payload)
          rm -rf "$WORK_IPA"

          # Final verification that BOTH files exist
          ls -lh "$OUT_DIR/EaSportsFc27.ipa" "$OUT_DIR/romfs.img"
          df -h /

      - name: 5. Stream-Upload EaSportsFc27.ipa + romfs.img to Gofile (curl, 0 RAM Bloat)
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          OUT_DIR="$CM_BUILD_DIR/final_out"
          [ -f "$OUT_DIR/EaSportsFc27.ipa" ] && [ -f "$OUT_DIR/romfs.img" ] || { echo "ERROR: Missing IPA or romfs.img in $OUT_DIR"; exit 1; }

          SERVER=$(python3 -c 'import requests; print(requests.get("https://api.gofile.io/servers", timeout=30).json()["data"]["servers"][0]["name"])')
          UPLOAD_URL="https://${SERVER}.gofile.io/contents/uploadfile"
          echo "Using Gofile server: $SERVER"

          FOLDER_ID=""
          GUEST_TOKEN=""
          DOWNLOAD_PAGE=""

          upload_one() {
            local fp="$1"
            local name
            name=$(basename "$fp")
            local size_h
            size_h=$(du -h "$fp" | cut -f1)
            local attempt
            for attempt in 1 2 3; do
              echo "Uploading $name ($size_h) [try $attempt/3]..."
              local CURL_ARGS=(-f -sS --max-time 5400 -F "file=@${fp}")
              if [ -n "$FOLDER_ID" ]; then
                CURL_ARGS+=(-F "folderId=${FOLDER_ID}" -F "token=${GUEST_TOKEN}")
              fi
              if RESP=$(curl "${CURL_ARGS[@]}" "$UPLOAD_URL"); then
                STATUS=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("status",""))' "$RESP")
                if [ "$STATUS" = "ok" ]; then
                  if [ -z "$FOLDER_ID" ]; then
                    FOLDER_ID=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["data"]["parentFolder"])' "$RESP")
                    GUEST_TOKEN=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["data"].get("guestToken",""))' "$RESP")
                    DOWNLOAD_PAGE=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["data"]["downloadPage"])' "$RESP")
                    echo ""
                    echo "=========================================="
                    echo "GOFILE DOWNLOAD PAGE: $DOWNLOAD_PAGE"
                    echo "=========================================="
                    echo ""
                  fi
                  echo "Done: $name"
                  return 0
                fi
              fi
              echo "WARN: Upload failed for $name (try $attempt), retrying in 10s..."
              sleep 10
            done
            echo "ERROR: Upload failed after 3 tries for $name"
            exit 1
          }

          # Upload IPA first so the Gofile link appears immediately in the log
          upload_one "$OUT_DIR/EaSportsFc27.ipa"
          upload_one "$OUT_DIR/romfs.img"

          echo ""
          echo "ALL DONE! Download BOTH EaSportsFc27.ipa & romfs.img from: $DOWNLOAD_PAGE"
