definitions:
  common_env: &common_env
    groups:
      - fc27_secrets
    vars:
      # Language code: "en" for default English, or e.g. "it", "fr", "es"
      GAME_LANG: "en"
    xcode: 27.0

  script_cleanup: &script_cleanup
    name: 1. Free Disk Space (Target > 190 GB)
    script: |
      set -euo pipefail
      df -h /
      rm -rf "${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}" "$HOME/Library/Android" || true
      xcrun simctl runtime delete all || true
      rm -rf "$HOME/Library/Caches/"* "$HOME/Library/Developer/Xcode/DerivedData/"* || true
      brew cleanup --prune=all || true
      df -h /

  script_tools: &script_tools
    name: 2. Install Build Tools, Metal Toolchain & Python Environment
    script: |
      set -euo pipefail
      if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
        echo "Downloading Xcode MetalToolchain..."
        xcodebuild -downloadComponent MetalToolchain
      fi
      xcrun -sdk macosx metal --version

      brew install xcodegen zstd spirv-cross || true

      curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
      chmod +x /tmp/dotnet-install.sh
      /tmp/dotnet-install.sh --channel 10.0 --architecture arm64 --install-dir "$HOME/.dotnet"
      /tmp/dotnet-install.sh --channel 10.0 --runtime dotnet --architecture x64 --install-dir "$HOME/.dotnet-x64"

      python3 -m venv "$CM_BUILD_DIR/.venv"
      source "$CM_BUILD_DIR/.venv/bin/activate"
      pip install --no-cache-dir --upgrade pip
      pip install --no-cache-dir \
        uv lz4 "capstone>=5,<6" fonttools nsz zbic pycryptodome zstandard pillow \
        requests gdown "backports.zstd; python_version < '3.14'"

  script_clone_and_download: &script_clone_and_download
    name: 3. Clone NX2Apple-FC27 & Download Game Files
    script: |
      set -euo pipefail
      source "$CM_BUILD_DIR/.venv/bin/activate"

      git clone --depth 1 https://github.com/sacoc96/NX2Apple-FC27.git "$CM_BUILD_DIR/NX2Apple-FC27"
      git clone --depth 1 https://github.com/ltsdw/gofile-downloader.git "$CM_BUILD_DIR/gf_dl"
      find "$CM_BUILD_DIR/NX2Apple-FC27" \( -name "*.sh" -o -name "dmsh_xlate" -o -name "spirv-cross" -o -name "nx_extract" \) -exec chmod +x {} + || true

      GAME_DIR="$CM_BUILD_DIR/game_nsp"
      KEYS_DIR="$CM_BUILD_DIR/keys"
      mkdir -p "$GAME_DIR" "$KEYS_DIR"

      download_url() {
        local url="$1"
        local out_dir="$2"
        mkdir -p "$out_dir"
        if [[ "$url" == *"gofile.io/d/"* ]]; then
          echo "Downloading from Gofile via gofile-downloader.py..."
          (cd "$CM_BUILD_DIR/gf_dl" && GF_DOWNLOAD_DIR="$out_dir" uv run gofile-downloader.py "$url")
        elif [[ "$url" == *"drive.google.com"* ]]; then
          echo "Downloading from Google Drive via gdown..."
          gdown "$url" -O "$out_dir/"
        else
          echo "Downloading direct URL..."
          local fname
          fname=$(basename "${url%%\?*}")
          [ -n "$fname" ] || fname="downloaded_file"
          curl -fL --retry 3 "$url" -o "$out_dir/$fname"
        fi
      }

      if [ -z "${BASE_URL:-}" ] || [ -z "${UPDATE_URL:-}" ] || [ -z "${KEYS_URL:-}" ]; then
        echo "ERROR: BASE_URL, UPDATE_URL, and KEYS_URL must be set in group fc27_secrets."
        exit 1
      fi

      echo "Downloading Base NSP..."
      download_url "$BASE_URL" "$GAME_DIR"
      echo "Downloading Update NSP..."
      download_url "$UPDATE_URL" "$GAME_DIR"
      echo "Downloading prod.keys..."
      download_url "$KEYS_URL" "$KEYS_DIR"

      if [ -n "${DLC_URL:-}" ]; then
        echo "Downloading optional DLC..."
        download_url "$DLC_URL" "$GAME_DIR"
      fi

      find "$GAME_DIR" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.nsz" -o -iname "*.xci" \) -exec mv -f {} "$GAME_DIR/" \;

      KEY_FILE=$(find "$KEYS_DIR" -type f ! -name ".*" | head -n 1)
      if [ -z "$KEY_FILE" ]; then
        echo "ERROR: prod.keys not found after download!"
        exit 1
      fi
      if [ "$KEY_FILE" != "$KEYS_DIR/prod.keys" ]; then
        cp -f "$KEY_FILE" "$KEYS_DIR/prod.keys"
      fi

      if [ -n "${CAPTURE_URL:-}" ]; then
        echo "Downloading pre-captured nvn_capture.zip..."
        CAP_TMP="$CM_BUILD_DIR/cap_tmp"
        CAP_DEST="$GAME_DIR/0100C49025D3E000_build/extract/v393216/nvn_capture"
        mkdir -p "$CAP_TMP" "$CAP_DEST"
        download_url "$CAPTURE_URL" "$CAP_TMP"
        CAP_ARCH=$(find "$CAP_TMP" -type f -iname "*.zip" | head -n 1 || true)
        if [ -n "$CAP_ARCH" ]; then
          unzip -qo "$CAP_ARCH" -d "$CAP_DEST"
          if [ -d "$CAP_DEST/nvn_capture" ]; then
            mv -f "$CAP_DEST/nvn_capture/"* "$CAP_DEST/"
            rmdir "$CAP_DEST/nvn_capture" || true
          fi
        fi
        rm -rf "$CAP_TMP"
        echo "Loaded pre-captured files: $(ls -1 "$CAP_DEST" | wc -l)"
      fi

      ls -lh "$GAME_DIR"
      df -h /

workflows:
  # =====================================================================
  # WORKFLOW 1: Build FC 27 iOS IPA + RomFS
  # - Without CAPTURE_URL: skips Metal 4 VM capture, builds with static shaders.
  # - With CAPTURE_URL (609 shaders from Mac): builds full 609/609 shader IPA.
  # =====================================================================
  build-fc27-ios:
    name: 1. FC 27 Build iOS IPA + RomFS
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment: *common_env
    scripts:
      - *script_cleanup
      - *script_tools
      - *script_clone_and_download

      - name: 4. Build FC 27 iOS IPA + RomFS
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          export DOTNET_ROOT_X64="$HOME/.dotnet-x64"
          export DOTNET_ROLL_FORWARD=Major
          export PATH="$HOME/.dotnet:$PATH"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_FILE="$CM_BUILD_DIR/keys/prod.keys"
          LOG_DIR="$GAME_DIR/0100C49025D3E000_build/logs"
          cd "$CM_BUILD_DIR/NX2Apple-FC27"

          trap 'echo "=== ERROR LOGS ==="; for lf in "$LOG_DIR"/*.log; do [ -f "$lf" ] && echo "--- $lf ---" && tail -n 120 "$lf"; done' ERR

          if [ -z "${CAPTURE_URL:-}" ] && [ -f "dm/games/0100C49025D3E000/nvn_capture.tsv" ]; then
            echo "CAPTURE_URL is empty -> skipping runtime NVN capture to build with static shaders."
            mv -f "dm/games/0100C49025D3E000/nvn_capture.tsv" "dm/games/0100C49025D3E000/nvn_capture.tsv.disabled"
          fi

          LANG_ARGS=()
          if [ "${GAME_LANG:-en}" != "en" ]; then
            LANG_ARGS=(-l "$GAME_LANG")
          fi

          DM_ENTITLEMENTS=ios_entitlements.plist \
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" --platform ios -k "$KEYS_FILE" ${LANG_ARGS[@]+"${LANG_ARGS[@]}"}

          IPA_PATH=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa generated!"
            exit 1
          fi

          WORK_IPA="$CM_BUILD_DIR/ipa_credit"
          mkdir -p "$WORK_IPA"
          unzip -qo "$IPA_PATH" -d "$WORK_IPA"
          PLIST=$(find "$WORK_IPA/Payload" -maxdepth 2 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright 'Port by Miaomiaocutene'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string 'Port by Miaomiaocutene'" "$PLIST"
          fi
          rm -f "$IPA_PATH"
          (cd "$WORK_IPA" && zip -qry "$IPA_PATH" Payload)
          rm -rf "$WORK_IPA"

          ls -lh "$IPA_PATH"
          if [ -d "$GAME_DIR/romfs" ]; then
            du -sh "$GAME_DIR/romfs"
          fi

      - name: 5. Upload IPA & RomFS Folder to Gofile
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          IPA_PATH=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" | head -n 1)

          python3 - "$IPA_PATH" "$GAME_DIR/romfs" << 'EOF'
          import os, sys, glob, requests

          ipa_path = sys.argv[1]
          romfs_dir = sys.argv[2]

          server = requests.get("https://api.gofile.io/servers", timeout=30).json()["data"]["servers"][0]["name"]
          upload_url = f"https://{server}.gofile.io/contents/uploadfile"

          def upload_file(path, folder_id=None, token=None):
              size_mb = os.path.getsize(path) / (1024 * 1024)
              print(f"Uploading {os.path.basename(path)} ({size_mb:.1f} MB)...")
              data = {}
              if folder_id:
                  data["folderId"] = folder_id
              if token:
                  data["token"] = token
              with open(path, "rb") as f:
                  r = requests.post(upload_url, data=data, files={"file": (os.path.basename(path), f)}, timeout=1800)
              r.raise_for_status()
              j = r.json()
              if j.get("status") != "ok":
                  raise RuntimeError(f"Gofile upload failed: {j}")
              return j["data"]

          first = upload_file(ipa_path)
          folder_id = first["parentFolder"]
          token = first.get("guestToken")
          download_page = first["downloadPage"]
          print(f"\n==========================================")
          print(f"GOFILE DOWNLOAD PAGE: {download_page}")
          print(f"==========================================\n")

          if os.path.isdir(romfs_dir):
              for fp in sorted(glob.glob(os.path.join(romfs_dir, "*"))):
                  if os.path.isfile(fp):
                      upload_file(fp, folder_id=folder_id, token=token)

          print(f"\nALL DONE! Download everything from: {download_page}")
          EOF

  # =====================================================================
  # WORKFLOW 2: Build Mac App + 1-Click Shader Capture Kit for a Mac Friend
  # Produces EA SPORTS FC 27.app + Run_FC27_Capture.command split into 4 GB
  # parts on Gofile so a friend on Apple Silicon Mac can capture all 609
  # shaders without installing Xcode/Homebrew/Python/.NET.
  # =====================================================================
  build-fc27-mac-kit:
    name: 2. FC 27 Build Mac App + Capture Kit (Gofile)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment: *common_env
    scripts:
      - *script_cleanup
      - *script_tools
      - *script_clone_and_download

      - name: 4. Build Mac App & Generate 1-Click Capture Kit
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          export DOTNET_ROOT_X64="$HOME/.dotnet-x64"
          export DOTNET_ROLL_FORWARD=Major
          export PATH="$HOME/.dotnet:$PATH"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_FILE="$CM_BUILD_DIR/keys/prod.keys"
          LOG_DIR="$GAME_DIR/0100C49025D3E000_build/logs"
          cd "$CM_BUILD_DIR/NX2Apple-FC27"

          trap 'echo "=== ERROR LOGS ==="; for lf in "$LOG_DIR"/*.log; do [ -f "$lf" ] && echo "--- $lf ---" && tail -n 120 "$lf"; done' ERR

          # Disable VM capture during Codemagic build (keep copy for reference)
          if [ -f "dm/games/0100C49025D3E000/nvn_capture.tsv" ]; then
            cp -f "dm/games/0100C49025D3E000/nvn_capture.tsv" "$CM_BUILD_DIR/nvn_capture.tsv"
            mv -f "dm/games/0100C49025D3E000/nvn_capture.tsv" "dm/games/0100C49025D3E000/nvn_capture.tsv.disabled"
          fi

          LANG_ARGS=()
          if [ "${GAME_LANG:-en}" != "en" ]; then
            LANG_ARGS=(-l "$GAME_LANG")
          fi

          python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" --platform mac-app -k "$KEYS_FILE" ${LANG_ARGS[@]+"${LANG_ARGS[@]}"}

          APP_PATH=$(find "$GAME_DIR" -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app generated!"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")

          # Detect exact shader-capture env var used by NX2Apple-FC27/scripts/nvn_capture_play.py
          CAP_ENV=$(python3 - << 'PYEOF'
          import re
          src = open("scripts/nvn_capture_play.py", "r", encoding="utf-8", errors="ignore").read()
          m = re.findall(r'DM_[A-Z0-9_]*CAP[A-Z0-9_]*|DM_[A-Z0-9_]*SHADER[A-Z0-9_]*|DM_[A-Z0-9_]*DUMP[A-Z0-9_]*', src)
          print(m[0] if m else "DM_NVN_SHADER_CAPTURE")
          PYEOF
          )
          echo "Detected shader capture env var from nvn_capture_play.py: $CAP_ENV"

          # Free NSPs and intermediate build folder before packaging to keep >150 GB free
          KIT_DIR="$CM_BUILD_DIR/FC27_Mac_Kit"
          mkdir -p "$KIT_DIR"
          mv -f "$APP_PATH" "$KIT_DIR/$APP_NAME"
          [ -f "$CM_BUILD_DIR/nvn_capture.tsv" ] && cp -f "$CM_BUILD_DIR/nvn_capture.tsv" "$KIT_DIR/nvn_capture.tsv"
          rm -rf "$GAME_DIR"

          cat << EOF > "$KIT_DIR/Run_FC27_Capture.command"
          #!/bin/bash
          set -e
          DIR="\$(cd "\$(dirname "\$0")" && pwd)"
          APP="\$DIR/$APP_NAME"
          OUT="\$HOME/Desktop/fc27_nvn_capture"
          mkdir -p "\$OUT"

          echo "Removing macOS quarantine..."
          xattr -dr com.apple.quarantine "\$APP" 2>/dev/null || true

          BIN=\$(find "\$APP/Contents/MacOS" -type f -perm +111 | head -n 1)
          echo "Launching FC 27 with $CAP_ENV=\$OUT"
          echo "Play through: Main Menu -> Manager Career (cutscenes, squad, contracts) -> Player Career -> 1 Full Match."
          echo "Close the game window when finished to auto-create nvn_capture.zip on your Desktop!"
          $CAP_ENV="\$OUT" "\$BIN" || true

          echo ""
          echo "Captured files: \$(ls -1 "\$OUT" | wc -l)"
          (cd "\$HOME/Desktop" && zip -qry "\$HOME/Desktop/nvn_capture.zip" "fc27_nvn_capture")
          echo "DONE! Please send \$HOME/Desktop/nvn_capture.zip back!"
          read -p "Press Enter to close..."
          EOF
          chmod +x "$KIT_DIR/Run_FC27_Capture.command"

          # Split into 4 GB uncompressed tar parts for reliable Gofile downloads
          OUT_DIR="$CM_BUILD_DIR/mac_kit_upload"
          mkdir -p "$OUT_DIR"
          (cd "$CM_BUILD_DIR" && tar -cf - "FC27_Mac_Kit" | split -b 4000m - "$OUT_DIR/FC27_Mac_Kit.tar.part_")
          rm -rf "$KIT_DIR"

          cat << 'EOF' > "$OUT_DIR/1_Unpack_FC27_Mac.command"
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Unpacking FC27_Mac_Kit from split parts..."
          cat "$DIR"/FC27_Mac_Kit.tar.part_* | tar -xf - -C "$DIR"
          echo "DONE! Open the FC27_Mac_Kit folder and double-click Run_FC27_Capture.command."
          read -p "Press Enter to close..."
          EOF
          chmod +x "$OUT_DIR/1_Unpack_FC27_Mac.command"

          ls -lh "$OUT_DIR"
          df -h /

      - name: 5. Upload Mac Capture Kit Parts to Gofile
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          python3 - "$CM_BUILD_DIR/mac_kit_upload" << 'EOF'
          import os, sys, glob, requests

          out_dir = sys.argv[1]
          files = sorted(glob.glob(os.path.join(out_dir, "*")))
          server = requests.get("https://api.gofile.io/servers", timeout=30).json()["data"]["servers"][0]["name"]
          upload_url = f"https://{server}.gofile.io/contents/uploadfile"

          folder_id = None
          token = None
          download_page = None

          for fp in files:
              if not os.path.isfile(fp):
                  continue
              size_mb = os.path.getsize(fp) / (1024 * 1024)
              print(f"Uploading {os.path.basename(fp)} ({size_mb:.1f} MB)...")
              data = {}
              if folder_id:
                  data["folderId"] = folder_id
              if token:
                  data["token"] = token
              with open(fp, "rb") as f:
                  r = requests.post(upload_url, data=data, files={"file": (os.path.basename(fp), f)}, timeout=1800)
              r.raise_for_status()
              j = r.json()
              if j.get("status") != "ok":
                  raise RuntimeError(f"Gofile upload failed: {j}")
              res = j["data"]
              if not folder_id:
                  folder_id = res["parentFolder"]
                  token = res.get("guestToken")
                  download_page = res["downloadPage"]
                  print(f"\n==========================================")
                  print(f"MAC KIT GOFILE LINK: {download_page}")
                  print(f"==========================================\n")

          print(f"\nALL DONE! Share this Gofile link with your Mac friend: {download_page}")
          EOF
