workflows:
  build-fc27-ios:
    name: EA SPORTS FC 27 iOS (seedds/nxnative — A17 Pro+ Optimized)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - fc27_secrets
      vars:
        # Language code: "en" for default English, or e.g. "it", "fr", "es"
        GAME_LANG: "en"
      xcode: 27.0
    scripts:
      - name: 1. Free Disk Space (Target > 190 GB)
        script: |
          set -euo pipefail
          df -h /
          rm -rf "${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}" "$HOME/Library/Android" || true
          xcrun simctl runtime delete all || true
          rm -rf "$HOME/Library/Caches/"* "$HOME/Library/Developer/Xcode/DerivedData/"* || true
          brew cleanup --prune=all || true
          df -h /

      - name: 2. Install & Verify All Build Tools (Fail-Fast)
        script: |
          set -euo pipefail
          # 2A. Metal Toolchain (with Xcode 26/27 DMG manual-mount fallback)
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Downloading Xcode MetalToolchain..."
            xcodebuild -downloadComponent MetalToolchain || true
            sleep 3
          fi
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "MetalToolchain not auto-mounted; manually installing Metal.xctoolchain from DMG..."
            DMG=$(find /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain -name "*.dmg" 2>/dev/null | head -n 1 || true)
            if [ -n "$DMG" ]; then
              mkdir -p /tmp/metal_mnt
              hdiutil attach -nobrowse -readonly "$DMG" -mountpoint /tmp/metal_mnt
              TC=$(find /tmp/metal_mnt -maxdepth 3 -name "Metal.xctoolchain" -type d | head -n 1 || true)
              if [ -n "$TC" ]; then
                sudo mkdir -p /Library/Developer/Toolchains
                sudo rm -rf /Library/Developer/Toolchains/Metal.xctoolchain
                sudo cp -R "$TC" /Library/Developer/Toolchains/Metal.xctoolchain
              fi
              hdiutil detach /tmp/metal_mnt || true
            fi
            sudo xcodebuild -runFirstLaunch || true
          fi
          xcrun -sdk macosx metal --version
          xcrun -sdk iphoneos metal --version

          # 2B. CLI tools required by seedds/nxnative
          brew install xcodegen zstd spirv-cross glslang || true
          for tool in xcodegen zstd spirv-cross glslangValidator; do
            command -v "$tool" >/dev/null 2>&1 || { echo "ERROR: Missing required tool: $tool"; exit 1; }
          done

          # 2C. Dual-arch .NET 10 (arm64 + x64)
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel 10.0 --architecture arm64 --install-dir "$HOME/.dotnet"
          /tmp/dotnet-install.sh --channel 10.0 --runtime dotnet --architecture x64 --install-dir "$HOME/.dotnet-x64"

          # 2D. Python virtual environment
          python3 -m venv "$CM_BUILD_DIR/.venv"
          source "$CM_BUILD_DIR/.venv/bin/activate"
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir \
            uv lz4 "capstone>=5,<6" fonttools nsz zbic pycryptodome zstandard pillow \
            requests gdown "backports.zstd; python_version < '3.14'"

      - name: 3. Clone Upstream seedds/nxnative & Download Game Files
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          git clone --depth 1 https://github.com/seedds/nxnative.git "$CM_BUILD_DIR/nxnative"
          git clone --depth 1 https://github.com/ltsdw/gofile-downloader.git "$CM_BUILD_DIR/gf_dl"
          find "$CM_BUILD_DIR/nxnative" \( -name "*.sh" -o -name "dmsh_xlate" -o -name "spirv-cross" -o -name "nx_extract" \) -exec chmod +x {} + || true

          # Fail-fast check before spending ~12 min downloading 36 GB
          if [ ! -f "$CM_BUILD_DIR/nxnative/dm/gfx/tools/frostbite.py" ] || [ ! -d "$CM_BUILD_DIR/nxnative/dm/games/0100C49025D3E000" ]; then
            echo "ERROR: seedds/nxnative missing frostbite.py or 0100C49025D3E000 profile!"
            exit 1
          fi
          ls -la "$CM_BUILD_DIR/nxnative/dm/gfx/tools/frostbite.py" "$CM_BUILD_DIR/nxnative/dm/games/0100C49025D3E000/"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_DIR="$CM_BUILD_DIR/keys"
          mkdir -p "$GAME_DIR" "$KEYS_DIR"

          download_url() {
            local url="$1"
            local out_dir="$2"
            mkdir -p "$out_dir"
            if [[ "$url" == *"gofile.io/d/"* ]]; then
              echo "Downloading from Gofile via gofile-downloader.py..."
              (cd "$CM_BUILD_DIR/gf_dl" && GF_DOWNLOAD_DIR="$out_dir" uv run gofile-downloader.py "$url")
            elif [[ "$url" == *"drive.google.com"* ]]; then
              echo "Downloading from Google Drive via gdown..."
              gdown "$url" -O "$out_dir/"
            else
              echo "Downloading direct URL..."
              local fname
              fname=$(basename "${url%%\?*}")
              [ -n "$fname" ] || fname="downloaded_file"
              curl -fL --retry 3 "$url" -o "$out_dir/$fname"
            fi
          }

          if [ -z "${BASE_URL:-}" ] || [ -z "${UPDATE_URL:-}" ] || [ -z "${KEYS_URL:-}" ]; then
            echo "ERROR: BASE_URL, UPDATE_URL, and KEYS_URL must be set in group fc27_secrets."
            exit 1
          fi

          echo "Downloading Base NSP..."
          download_url "$BASE_URL" "$GAME_DIR"
          echo "Downloading Update NSP..."
          download_url "$UPDATE_URL" "$GAME_DIR"
          echo "Downloading prod.keys..."
          download_url "$KEYS_URL" "$KEYS_DIR"

          if [ -n "${DLC_URL:-}" ]; then
            echo "Downloading optional DLC..."
            download_url "$DLC_URL" "$GAME_DIR"
          fi

          find "$GAME_DIR" -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.nsz" -o -iname "*.xci" \) -exec mv -f {} "$GAME_DIR/" \;

          KEY_FILE=$(find "$KEYS_DIR" -type f ! -name ".*" | head -n 1)
          if [ -z "$KEY_FILE" ]; then
            echo "ERROR: prod.keys not found after download!"
            exit 1
          fi
          if [ "$KEY_FILE" != "$KEYS_DIR/prod.keys" ]; then
            cp -f "$KEY_FILE" "$KEYS_DIR/prod.keys"
          fi

          ls -lh "$GAME_DIR"
          df -h /

      - name: 4. Inject Credit UI & Build FC 27 iOS IPA + Separate RomFS (A17 Pro+)
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          export DOTNET_ROOT_X64="$HOME/.dotnet-x64"
          export DOTNET_ROLL_FORWARD=Major
          export PATH="$HOME/.dotnet:$PATH"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"
          KEYS_FILE="$CM_BUILD_DIR/keys/prod.keys"
          LOG_DIR="$GAME_DIR/0100C49025D3E000_build/logs"
          cd "$CM_BUILD_DIR/nxnative"

          trap 'echo "=== ERROR LOGS ==="; for lf in "$LOG_DIR"/*.log; do [ -f "$lf" ] && echo "--- $lf ---" && tail -n 120 "$lf"; done' ERR

          # 4A. Inject "Port by Miaomiaocutene" + custom SwiftUI cat icon into Launcher.swift
          python3 - << 'PYEOF'
          import os, re, subprocess, shutil

          candidates = [
              "dm/ios/Sources/Launcher.swift",
              "src/dm/ios/Sources/Launcher.swift",
          ]
          target = next((p for p in candidates if os.path.isfile(p)), None)
          if not target:
              print("WARNING: Launcher.swift not found, skipping Launcher UI credit patch.")
              raise SystemExit(0)

          orig = open(target, "r", encoding="utf-8").read()
          if "Port by Miaomiaocutene" in orig:
              print("Launcher.swift already contains credit.")
              raise SystemExit(0)

          credit_defs = """
          private struct MiaoCatIcon: Shape {
              func path(in rect: CGRect) -> Path {
                  var p = Path()
                  let w = rect.width, h = rect.height
                  p.move(to: CGPoint(x: w * 0.16, y: h * 0.42))
                  p.addLine(to: CGPoint(x: w * 0.22, y: h * 0.12))
                  p.addLine(to: CGPoint(x: w * 0.40, y: h * 0.30))
                  p.addQuadCurve(to: CGPoint(x: w * 0.60, y: h * 0.30), control: CGPoint(x: w * 0.50, y: h * 0.26))
                  p.addLine(to: CGPoint(x: w * 0.78, y: h * 0.12))
                  p.addLine(to: CGPoint(x: w * 0.84, y: h * 0.42))
                  p.addQuadCurve(to: CGPoint(x: w * 0.50, y: h * 0.88), control: CGPoint(x: w * 0.88, y: h * 0.82))
                  p.addQuadCurve(to: CGPoint(x: w * 0.16, y: h * 0.42), control: CGPoint(x: w * 0.12, y: h * 0.82))
                  p.closeSubpath()
                  return p
              }
          }

          private struct MiaoCreditRow: View {
              var body: some View {
                  HStack(spacing: 6) {
                      MiaoCatIcon()
                          .fill(Color(red: 1.0, green: 0.45, blue: 0.72))
                          .frame(width: 16, height: 16)
                      Text("Port by Miaomiaocutene")
                          .font(.footnote.weight(.semibold))
                          .foregroundStyle(.secondary)
                  }
                  .frame(maxWidth: .infinity, alignment: .center)
                  .padding(.vertical, 4)
              }
          }
          """

          patched = None
          for pat in [r'(Form\s*\{)', r'(List\s*\{)', r'(VStack(?:\([^)]*\))?\s*\{)']:
              m = re.search(pat, orig)
              if m:
                  idx = m.end()
                  patched = orig[:idx] + "\n            MiaoCreditRow()\n" + orig[idx:] + "\n" + credit_defs
                  break

          if not patched:
              print("WARNING: Could not find Form/List/VStack in Launcher.swift, skipping.")
              raise SystemExit(0)

          backup = target + ".bak"
          shutil.copy2(target, backup)
          open(target, "w", encoding="utf-8").write(patched)

          res = subprocess.run(["xcrun", "swiftc", "-parse", target], capture_output=True, text=True)
          if res.returncode != 0:
              print("WARNING: swiftc -parse failed after credit patch, reverting Launcher.swift:", res.stderr)
              shutil.move(backup, target)
          else:
              os.remove(backup)
              print("Successfully patched Launcher.swift with MiaoCreditRow + MiaoCatIcon!")
          PYEOF

          # 4B. Full RAM entitlements for iPhone 15 Pro+ (A17 Pro+, 8 GB+ RAM)
          cat << 'EOF' > "$CM_BUILD_DIR/ios_entitlements.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key>
            <true/>
          </dict>
          </plist>
          EOF

          LANG_ARGS=()
          if [ "${GAME_LANG:-en}" != "en" ]; then
            LANG_ARGS=(-l "$GAME_LANG")
          fi

          # Hardware BC (no DM_PROF_TEX_BC_CPU), native 60 FPS + MetalFX from profile
          DM_ENTITLEMENTS="$CM_BUILD_DIR/ios_entitlements.plist" \
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" --platform ios --romfs separate -k "$KEYS_FILE" ${LANG_ARGS[@]+"${LANG_ARGS[@]}"}

          IPA_PATH=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa generated!"
            exit 1
          fi

          # Free build intermediates before re-zipping IPA
          rm -rf "$GAME_DIR/0100C49025D3E000_build"

          # 4C. Inject credit into Info.plist
          WORK_IPA="$CM_BUILD_DIR/ipa_credit"
          mkdir -p "$WORK_IPA"
          unzip -qo "$IPA_PATH" -d "$WORK_IPA"
          PLIST=$(find "$WORK_IPA/Payload" -maxdepth 2 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright 'Port by Miaomiaocutene'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string 'Port by Miaomiaocutene'" "$PLIST"
          fi
          rm -f "$IPA_PATH"
          (cd "$WORK_IPA" && zip -qry "$IPA_PATH" Payload)
          rm -rf "$WORK_IPA"

          echo "=== Build outputs ==="
          ls -lh "$GAME_DIR"
          df -h /

      - name: 5. Upload IPA & RomFS Outputs to Gofile (4x Parallel + Auto-Retry)
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.venv/bin/activate"

          GAME_DIR="$CM_BUILD_DIR/game_nsp"

          python3 - "$GAME_DIR" << 'EOF'
          import os, sys, glob, time, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed

          game_dir = sys.argv[1]
          ipa_files = sorted(p for p in glob.glob(os.path.join(game_dir, "*.ipa")) if os.path.isfile(p))
          romfs_files = sorted(p for p in glob.glob(os.path.join(game_dir, "*.img")) if os.path.isfile(p))
          romfs_dir = os.path.join(game_dir, "romfs")
          if os.path.isdir(romfs_dir):
              romfs_files += sorted(p for p in glob.glob(os.path.join(romfs_dir, "*")) if os.path.isfile(p))

          if not ipa_files:
              raise RuntimeError(f"No .ipa found in {game_dir}")

          server = requests.get("https://api.gofile.io/servers", timeout=30).json()["data"]["servers"][0]["name"]
          upload_url = f"https://{server}.gofile.io/contents/uploadfile"

          def upload_with_retry(path, folder_id=None, token=None, retries=3):
              size_mb = os.path.getsize(path) / (1024 * 1024)
              name = os.path.basename(path)
              for attempt in range(1, retries + 1):
                  try:
                      print(f"Uploading {name} ({size_mb:.1f} MB) [try {attempt}/{retries}]...", flush=True)
                      data = {}
                      if folder_id:
                          data["folderId"] = folder_id
                      if token:
                          data["token"] = token
                      with open(path, "rb") as f:
                          r = requests.post(upload_url, data=data, files={"file": (name, f)}, timeout=1800)
                      r.raise_for_status()
                      j = r.json()
                      if j.get("status") != "ok":
                          raise RuntimeError(f"Gofile API error: {j}")
                      print(f"Done: {name}", flush=True)
                      return j["data"]
                  except Exception as e:
                      print(f"WARN: upload failed for {name} (try {attempt}): {e}", flush=True)
                      if attempt == retries:
                          raise
                      time.sleep(5 * attempt)

          # Upload IPA first to create folder and print download link immediately
          first = upload_with_retry(ipa_files[0])
          folder_id = first["parentFolder"]
          token = first.get("guestToken")
          download_page = first["downloadPage"]
          print(f"\n==========================================", flush=True)
          print(f"GOFILE DOWNLOAD PAGE: {download_page}", flush=True)
          print(f"==========================================\n", flush=True)

          # Upload remaining files in parallel (4 workers) to stay well within 120m limit
          remaining = ipa_files[1:] + romfs_files
          if remaining:
              with ThreadPoolExecutor(max_workers=4) as pool:
                  futs = {pool.submit(upload_with_retry, fp, folder_id, token): fp for fp in remaining}
                  for fut in as_completed(futs):
                      fut.result()

          print(f"\nALL DONE! Download everything from: {download_page}", flush=True)
          EOF
